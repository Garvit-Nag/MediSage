name: Keepalive Ping

on:
  schedule:
    - cron: '0 12 */3 * *'  # every 3 days at noon UTC
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping databases via HF Space
        run: |
          curl -f --max-time 60 https://garvitcpp-medisage.hf.space/api/ping
